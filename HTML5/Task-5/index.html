<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task-5</title>
        <link rel="stylesheet" href="./style.css">
    </head>

    <body>

        <div class="task5">
            <form action="#" method="post">
                <h2>Event Registration Form</h2>

                <label for="name">Name :</label>
                <input type="text" id="name" placeholder="Pavan" required autofocus>

                <label for="email">Email :</label>
                <input type="email" id="email" placeholder="xyz@gmail" required>

                <label for="date">Date :</label>
                <input type="date" id="date" required>

                <label for="event-type">Event-Type :</label>

                <select id="event-type">
                    <option value="dance" selected>Dance</option>
                    <option value="music">Music</option>
                    <option value="racing">Racing</option>
                    <option value="fashion">Fashion</option>
                    <option value="sports">Sports</option>
                    <option value="painting">Painting</option>
                </select>

                <label for="message">Message :</label>
                <textarea id="message" placeholder="Hi Hello ..." required></textarea>

                <button type="submit">Register</button>

                <output id="output"></output>
            </form>
        </div>

    </body>

</html>
