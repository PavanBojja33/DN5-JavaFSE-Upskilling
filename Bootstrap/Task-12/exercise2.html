<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Exercise 12.2 - Pricing Section with Spacing</title>
</head>
<body class="bg-light">

    <!-- Page Header -->
    <div class="container mt-5 mb-4 text-center">
        <h1 class="mb-2">Our Pricing Plans</h1>
        <p class="text-muted">Choose the plan that works best for you.</p>
    </div>

    <!-- Pricing Cards -->
    <div class="container mb-5">
        <div class="row justify-content-center g-4">

            <!-- Basic Plan -->
            <div class="col-md-4">
                <div class="card text-center p-4 h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Basic</h5>
                        <h2 class="mb-4">$9<small class="fs-6 text-muted">/mo</small></h2>
                        <ul class="list-unstyled mb-4">
                            <li class="mb-2">5 Projects</li>
                            <li class="mb-2">10 GB Storage</li>
                            <li class="mb-2">Email Support</li>
                        </ul>
                        <button class="btn btn-outline-primary px-4 py-2 mt-2">Get Started</button>
                    </div>
                </div>
            </div>

            <!-- Pro Plan (Highlighted) -->
            <div class="col-md-4">
                <div class="card text-center text-white bg-primary p-4 h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Pro</h5>
                        <h2 class="mb-4">$29<small class="fs-6 opacity-75">/mo</small></h2>
                        <ul class="list-unstyled mb-4">
                            <li class="mb-2">Unlimited Projects</li>
                            <li class="mb-2">100 GB Storage</li>
                            <li class="mb-2">Priority Support</li>
                        </ul>
                        <button class="btn btn-light px-4 py-2 mt-2">Get Started</button>
                    </div>
                </div>
            </div>

            <!-- Enterprise Plan -->
            <div class="col-md-4">
                <div class="card text-center p-4 h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Enterprise</h5>
                        <h2 class="mb-4">$79<small class="fs-6 text-muted">/mo</small></h2>
                        <ul class="list-unstyled mb-4">
                            <li class="mb-2">Unlimited Projects</li>
                            <li class="mb-2">1 TB Storage</li>
                            <li class="mb-2">24/7 Dedicated Support</li>
                        </ul>
                        <button class="btn btn-outline-primary px-4 py-2 mt-2">Get Started</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
