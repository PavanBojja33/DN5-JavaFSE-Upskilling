<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Icon-only Buttons</title>
</head>
<body class="p-4">
    <div class="container">
        <h2 class="mb-4">Icon-Only Buttons</h2>
        <button class="btn btn-primary me-2" title="Home"><i class="bi bi-house-fill"></i></button>
        <button class="btn btn-success me-2" title="Add"><i class="bi bi-plus-circle-fill"></i></button>
        <button class="btn btn-danger me-2" title="Delete"><i class="bi bi-trash-fill"></i></button>
        <button class="btn btn-warning me-2" title="Edit"><i class="bi bi-pencil-fill"></i></button>
        <button class="btn btn-info me-2" title="Search"><i class="bi bi-search"></i></button>
        <button class="btn btn-secondary" title="Settings"><i class="bi bi-gear-fill"></i></button>
    </div>
</body>
</html>
