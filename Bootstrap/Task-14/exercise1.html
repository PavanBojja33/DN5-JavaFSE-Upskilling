<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Display and Visibility</title>
</head>
<body class="p-4">
    <div class="container">
        <p class="d-none d-md-block bg-info p-2">Visible only on md and above (d-none d-md-block)</p>
        <p class="d-block d-md-none bg-warning p-2">Visible only on mobile (d-block d-md-none)</p>
        <p class="d-none d-lg-flex bg-success text-white p-2">Visible as flex on lg and above (d-none d-lg-flex)</p>
    </div>
</body>
</html>
