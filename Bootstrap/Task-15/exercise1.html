<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Borders and Rounded Corners</title>

<body class="p-4">

        <h2 class="mb-4">Border Utilities on Images</h2>
        <img src="https://via.placeholder.com/150" alt="Border example" class="border border-primary border-3 m-2">
        <img src="https://via.placeholder.com/150" alt="Rounded circle" class="border border-secondary rounded-circle m-2">
