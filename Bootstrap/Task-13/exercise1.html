<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Dashboard - Colors and Backgrounds</title>
</head>
<body class="p-4">
    <div class="container">
        <h2 class="mb-4">Dashboard</h2>
        <div class="row g-3">
            <div class="col-md-3">
                <div class="p-3 bg-primary text-white rounded">
                    <h5>Primary</h5>
                    <p class="mb-0">Sales: 120</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 bg-success text-white rounded">
                    <h5>Success</h5>
                    <p class="mb-0">Orders: 85</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 bg-warning text-dark rounded">
                    <h5>Warning</h5>
                    <p class="mb-0">Pending: 40</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 bg-danger text-white rounded">
                    <h5>Danger</h5>
                    <p class="mb-0">Errors: 5</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 bg-info text-dark rounded">
                    <h5>Info</h5>
                    <p class="mb-0 text-dark">Visitors: 200</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 bg-secondary text-white rounded">
                    <h5>Secondary</h5>
                    <p class="mb-0">Inactive: 15</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 bg-dark text-white rounded">
                    <h5 class="text-light">Dark</h5>
                    <p class="mb-0 text-muted">Total: 465</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
