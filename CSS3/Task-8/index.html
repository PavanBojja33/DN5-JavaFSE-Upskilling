<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Task-8</title>
</head>
<body>

    <h1>Local Community Event Portal</h1>

    <div class="eventCard">
        <h2>Dance Event</h2>
        <p>Join us for an exciting dance competition.</p>
    </div>

    <div class="eventCard">
        <h2>Music Event</h2>
        <p>Enjoy live performances by talented artists.</p>
    </div>

    <h2>Registration Form</h2>

    <form>
        <input type="text" placeholder="Enter Name" class="selected-field">
        <br><br>
        <input type="email" placeholder="Enter Email">
    </form>

    <h2>Visibility Hidden Example</h2>
    <p class="hidden-box">This text uses visibility: hidden</p>

    <h2>Display None Example</h2>
    <p class="none-box">This text uses display: none</p>

</body>
</html>
